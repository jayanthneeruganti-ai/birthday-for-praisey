<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praisey Birthday Journey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars"></div>

<section id="intro" class="screen active">
  <h1>Happy Birthday Praiseyyyyyyluuuu 🥺❤️</h1>
  <p>Let's travel across the universe together and see why you're my favorite co-pilot.</p>
  <button id="start">🚀 Start The Journey</button>
</section>

<section id="journey" class="screen">
  <div class="rocket">🚀 👦❤️👧</div>
  <div class="planet" id="planetVisual"></div>
  <h2 id="planetName"></h2>
  <p id="planetMsg"></p>
  <button id="next">Next Planet ➜</button>
</section>

<section id="final" class="screen">
  <h1>So u wanna travel with me for the rest of my life? ❤️🥺</h1>
  <button id="yes">YES 💖</button>
  <button id="no">NO 🙈</button>
  <h2 id="result"></h2>
</section>
<script src="script.js"></script>
</body>
</html>
